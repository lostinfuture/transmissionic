name: Web UI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webui:
    name: Build untagged web UI zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and lint
        run: |
          npm run typecheck
          npm run lint

      - name: Build web UI
        run: npm run build:webui

      - name: Pack transmissionic-webui-<gitsha>.zip
        run: |
          set -eu
          test -f dist/index.html
          test -f dist/LICENSE
          test -f dist/NOTICE
          test -f dist/default.json
          grep -q "Copyright (c) 2021 Transmissionic" dist/LICENSE
          grep -q "Copyright (c) 2026 lostinfuture" dist/NOTICE
          grep -q "script-src 'self'" dist/index.html
          grep -q 'src="./assets/' dist/index.html
          grep -q "Maintained fork." dist/index.html || grep -R -q "Maintained fork." dist
          node scripts/check-add-torrent.js
          node scripts/check-overlay-history.js
          node scripts/check-rpc.js
          node scripts/check-rpc-url.js
          node scripts/check-torrent-actions.js
          rm -rf web
          mkdir web
          cp -a dist/. web/
          sha=$(git rev-parse HEAD)
          name="transmissionic-webui-${sha}.zip"
          zip -r "$name" web
          test ! -f Transmissionic-webui-v1.10.0.zip
          unzip -p "$name" web/LICENSE | grep -q "Copyright (c) 2021 Transmissionic"

      - uses: actions/upload-artifact@v4
        with:
          name: transmissionic-webui-${{ github.sha }}
          path: transmissionic-webui-*.zip
          if-no-files-found: error

  release:
    name: Publish Transmissionic-webui-<tag>.zip
    if: github.ref_type == 'tag'
    needs: webui
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: transmissionic-webui-${{ github.sha }}
          path: dist-zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          src=$(echo dist-zip/transmissionic-webui-*.zip)
          file="Transmissionic-webui-${tag}.zip"
          cp "$src" "$file"
          sum=$(sha256sum "$file" | awk '{print $1}')
          printf 'Transmissionic web UI %s\n\nsha256: %s  %s\n' "$tag" "$sum" "$file" > notes.md
          gh release create "$tag" "$file" --title "$tag" --notes-file notes.md --repo "${GITHUB_REPOSITORY}"
