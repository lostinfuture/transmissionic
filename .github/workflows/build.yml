name: Web UI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webui:
    name: Build untagged web UI zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "16"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web UI
        run: npm run build:webui

      - name: Pack transmissionic-webui-<gitsha>.zip
        run: |
          set -eu
          test -f dist/index.html
          test -f dist/LICENSE
          test -f dist/NOTICE
          grep -q "Copyright (c) 2021 Transmissionic" dist/LICENSE
          grep -q "Copyright (c) 2026 lostinfuture" dist/NOTICE
          grep -q "Maintained fork." dist/index.html || grep -R -q "Maintained fork." dist
          rm -rf web
          mkdir web
          cp -a dist/. web/
          sha=$(git rev-parse HEAD)
          name="transmissionic-webui-${sha}.zip"
          zip -r "$name" web
          test ! -f Transmissionic-webui-v1.9.0.zip
          unzip -p "$name" web/LICENSE | grep -q "Copyright (c) 2021 Transmissionic"

      - uses: actions/upload-artifact@v4
        with:
          name: transmissionic-webui-${{ github.sha }}
          path: transmissionic-webui-*.zip
          if-no-files-found: error
